name: Import verified local MOW source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for complete source archive
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq -w 0 11); do
            test -f "import/mow/part-$i"
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Import source tree
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        env:
          SOURCE_COMMIT: c2c879e9b1beb72cb830f708a466950fc240dc2b
        run: |
          set -euo pipefail

          cat $(for i in $(seq -w 0 11); do printf 'import/mow/part-%s ' "$i"; done) > /tmp/mow-source.b64
          base64 --decode /tmp/mow-source.b64 > /tmp/mow-source.tgz
          rm -rf /tmp/mow-source
          mkdir -p /tmp/mow-source
          tar -xzf /tmp/mow-source.tgz -C /tmp/mow-source

          rsync -a --delete --exclude '.git' /tmp/mow-source/ ./

          mkdir -p docs/release
          cat > docs/release/remote-publication.md <<EOF
# Remote Publication Record

Local verified source commit imported: `$SOURCE_COMMIT`

Remote repository: `S-A-oghene/marketing-operations-workbench`

The repository was empty before this import. The source tree was transferred through a temporary GitHub Actions bootstrap process and the temporary bootstrap/import artifacts are removed by the import commit.

This record does not claim v1.0.0 release acceptance; the release gate remains subject to the evidence required by the master manual.
EOF

          rm -rf import
          rm -f .github/workflows/import-source.yml

          git config user.name "MOW Source Import"
          git config user.email "mow-source-import@users.noreply.github.com"
          git add -A
          git commit -m "feat: import verified Marketing Operations Workbench source" || exit 0
          git push origin HEAD:main
